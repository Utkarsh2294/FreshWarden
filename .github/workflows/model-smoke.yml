name: Optional live model smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *'
permissions:
  contents: read
jobs:
  smoke:
    if: vars.ENABLE_MODEL_SMOKE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node tools/model-smoke.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VISION_MODEL: ${{ vars.GEMINI_VISION_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_TEXT_MODEL: ${{ vars.GROQ_TEXT_MODEL }}
