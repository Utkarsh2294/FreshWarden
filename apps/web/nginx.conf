server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 9m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://cdn.jsdelivr.net https://tessdata.projectnaptha.com https://*.tile.openstreetmap.org; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ { proxy_pass http://api:5000; proxy_set_header Host $host; }
  location /health { proxy_pass http://api:5000; }
  location /socket.io/ { proxy_pass http://api:5000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location / { try_files $uri $uri/ /index.html; }
}
